<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Transect tool</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#f6f7f8; --card:#fff; --line:#d9dde1; --ink:#1d2328; --muted:#66707a;
          --accent:#0b7a75; --ok:#2e8b57; --warn:#d98a00; --bad:#c0392b; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background:var(--bg); color:var(--ink); }
  header { background:var(--accent); color:#fff; padding:10px 20px; display:flex; align-items:center; gap:20px; }
  header h1 { font-size:18px; margin:0; font-weight:600; cursor:pointer; }
  header .proj { opacity:.9; }
  main { padding:20px; max-width:1500px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin-bottom:16px; }
  h2 { font-size:17px; margin:0 0 10px; }
  button, .btn { font:inherit; padding:7px 14px; border-radius:6px; border:1px solid var(--line); background:#fff;
                 cursor:pointer; color:var(--ink); text-decoration:none; display:inline-block; }
  button.primary, .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  input[type=text], input[type=number] { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; }
  .muted { color:var(--muted); }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .tabs { display:flex; gap:4px; margin-bottom:16px; }
  .tabs button { border-radius:6px 6px 0 0; border-bottom:none; }
  .tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .tabs button.on .muted { color:#cfeeea; }
  .drop { border:2px dashed var(--line); border-radius:8px; padding:22px; text-align:center; color:var(--muted); }
  .drop.over { border-color:var(--accent); background:#eef8f7; }
  .bar { height:10px; background:#e5e8eb; border-radius:5px; overflow:hidden; }
  .bar > div { height:100%; background:var(--accent); width:0; transition:width .3s; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:12px; }
  .ph { border:1px solid var(--line); border-radius:6px; padding:6px; background:#fff; font-size:13px; }
  .ph.off { opacity:.45; }
  .ph .imgwrap { position:relative; }
  .ph img { width:100%; display:block; border-radius:4px; }
  .ph svg, .ctx svg { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; }
  .badge { font-size:12px; padding:1px 7px; border-radius:10px; color:#fff; background:#999; white-space:nowrap; }
  .b-ok { background:var(--ok); } .b-check { background:var(--warn); } .b-todo { background:#8a96a3; }
  .b-skipped, .b-excluded { background:#c4c9ce; color:#333; }
  .reader { display:grid; grid-template-columns:230px minmax(0, 1fr); gap:16px; align-items:start; }
  .reader > div { min-width:0; }
  .plist { max-height:78vh; overflow:auto; background:#fff; border:1px solid var(--line); border-radius:8px; }
  .plist div { padding:6px 10px; border-bottom:1px solid #eef0f2; cursor:pointer; display:flex; justify-content:space-between; gap:6px; font-size:14px; }
  .plist div.sel { background:#e3f3f1; font-weight:600; }
  .stripbox { overflow-x:auto; border:1px solid var(--line); border-radius:6px; background:#333; position:relative; }
  .stripinner { position:relative; cursor:crosshair; }
  .stripinner img { display:block; user-select:none; -webkit-user-drag:none; }
  .mk { position:absolute; top:0; bottom:0; width:0; border-left:2px solid #ff2d55; pointer-events:none; }
  .mk span { position:absolute; top:-1px; left:3px; background:#ff2d55; color:#fff; font-size:12px; padding:0 4px; border-radius:3px; white-space:nowrap; }
  .pop { position:absolute; z-index:5; background:#fff; border:1px solid var(--ink); border-radius:6px; padding:6px; box-shadow:0 4px 14px rgba(0,0,0,.3); }
  .pop input { width:130px; }
  .pop .parsed { font-size:12px; color:var(--muted); margin-top:3px; }
  table { border-collapse:collapse; }
  td, th { padding:4px 10px; border-bottom:1px solid #eef0f2; text-align:left; }
  .ctx { position:relative; width:220px; cursor:pointer; }
  .ctx img { width:100%; display:block; border-radius:4px; }
  .help { background:#fffbea; border:1px solid #f0e2a8; border-radius:6px; padding:10px 14px; font-size:14px; }
  .help b { white-space:nowrap; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:20; }
  .modal .box { background:#fff; border-radius:8px; padding:14px; max-width:96vw; max-height:96vh; overflow:auto; }
  .fixwrap { position:relative; display:inline-block; cursor:crosshair; }
  .fixwrap img { display:block; max-height:78vh; }
  .fixwrap svg { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; }
  .warn { color:var(--warn); }
  .err { color:var(--bad); }
  .preview { overflow-x:auto; border:1px solid var(--line); }
  .preview img { height:420px; display:block; }
  kbd { border:1px solid #ccc; border-bottom-width:2px; border-radius:3px; padding:0 4px; font-size:12px; background:#fafafa; }
</style>
</head>
<body>
<header>
  <h1 onclick="goHome()">Transect tool</h1>
  <span class="proj" id="hdrProj"></span>
</header>
<main id="app"></main>
<script src="/static/app.js"></script>
</body>
</html>
