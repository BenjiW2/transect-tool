name: Windows build

# Builds the Windows app (installer + portable zip), self-tests it, and attaches it to the GitHub release.
# Runs when a version tag (v1.2.3) is pushed, or by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release to attach the files to (e.g. v1.0.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pywebview pyinstaller

      - name: Build app
        run: pyinstaller --noconfirm --clean --distpath dist_win --workpath build_win packaging/TransectTool.spec

      - name: Self-test the packaged app
        run: |
          $exe = Resolve-Path "dist_win/Transect Tool/Transect Tool.exe"
          $out = Join-Path $PWD "selftest.txt"
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest', "`"$out`"" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out }
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit $($p.ExitCode))" }

      - name: Package (installer + portable zip)
        run: |
          $version = (Get-Content packaging/VERSION).Trim()
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "dist_win/Transect Tool" -DestinationPath "release/Transect-Tool-$version-windows-portable.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\dist_win\Transect Tool" "/DOutDir=$PWD\release" packaging\windows_installer.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
          Get-ChildItem release

      - uses: actions/upload-artifact@v4
        with:
          name: transect-tool-windows
          path: release/*

      - name: Attach to release
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $env:TAG --title "Transect Tool $env:TAG" --notes "See the README for how to install and use it." }
          gh release upload $env:TAG (Get-ChildItem release/*).FullName --clobber
